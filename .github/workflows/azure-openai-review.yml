name: Azure OpenAI PR review
run-name: 'Azure review · PR #${{ inputs.pull_request_number }} · CI ${{ github.event.workflow_run.id }}'

on:
  workflow_run:
    workflows: [Domain tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR number to review
        required: true
        type: string
      expected_head_sha:
        description: Commit from the automatic PR event (leave empty for manual runs)
        required: false
        type: string

permissions: {}

concurrency:
  group: azure-review-${{ github.event_name }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  dispatch-review:
    # Only successful, current PR CI can queue a main-branch run without Azure access.
    if: >-
      github.repository == 'openhealths/nationHealth' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Load the trusted CI gate from main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verify CI and queue trusted main review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: php .github/scripts/azure-ci-gate.php --queue

  review:
    # Only trusted main code runs with Azure credentials. Fork code is fetched as JSON patches.
    if: >-
      github.repository == 'openhealths/nationHealth' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
      actions: read
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Load the trusted review script from main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            docs/technical-requirements

      - name: Register the review status on the PR commit
        id: review-status
        run: php .github/scripts/azure-openai-review.php --start

      - name: Require successful tests and frontend build on the current commit
        if: steps.review-status.outputs.active == 'true'
        run: php .github/scripts/azure-ci-gate.php

      - name: Sign in to Azure using OIDC
        if: steps.review-status.outputs.active == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Review the PR diff and update the bot comment
        if: steps.review-status.outputs.active == 'true'
        env:
          AZURE_REVIEW_CHECK_ID: ${{ steps.review-status.outputs.check_id }}
          AZURE_REVIEW_HEAD_SHA: ${{ steps.review-status.outputs.head_sha }}
        shell: bash
        run: |
          token="$(az account get-access-token --resource https://cognitiveservices.azure.com --query accessToken --output tsv)"
          echo "::add-mask::$token"
          export AZURE_OPENAI_ACCESS_TOKEN="$token"
          php .github/scripts/azure-openai-review.php

      - name: Close the review status after failure or cancellation
        if: always() && steps.review-status.outputs.check_id != ''
        env:
          AZURE_REVIEW_CHECK_ID: ${{ steps.review-status.outputs.check_id }}
          REVIEW_JOB_STATUS: ${{ job.status }}
        run: php .github/scripts/azure-openai-review.php --finish

      - name: Register technical requirements review
        id: requirements-status
        if: success() && steps.review-status.outputs.active == 'true'
        run: php .github/scripts/azure-requirements-review.php --start

      - name: Review technical requirements against base and PR code
        if: steps.requirements-status.outputs.active == 'true'
        env:
          AZURE_REVIEW_CHECK_ID: ${{ steps.requirements-status.outputs.check_id }}
          AZURE_REVIEW_HEAD_SHA: ${{ steps.requirements-status.outputs.head_sha }}
        shell: bash
        run: |
          token="$(az account get-access-token --resource https://cognitiveservices.azure.com --query accessToken --output tsv)"
          echo "::add-mask::$token"
          export AZURE_OPENAI_ACCESS_TOKEN="$token"
          php .github/scripts/azure-requirements-review.php

      - name: Close technical requirements status after failure or cancellation
        if: always() && steps.requirements-status.outputs.check_id != ''
        env:
          AZURE_REVIEW_CHECK_ID: ${{ steps.requirements-status.outputs.check_id }}
          REVIEW_JOB_STATUS: ${{ job.status }}
        run: php .github/scripts/azure-requirements-review.php --finish
